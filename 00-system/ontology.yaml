version: "2.0.0"
name: "Agent Teacher Pedagogical Ontology"
description: "Stage, axis, capability, evidence and context are independent. Stage is not prior knowledge or AI assistance."

namespaces:
  stage: "S0-S7: educational setting or role, using the stages below."
  assistance: "AL0-AL7: AI assistance; never store these in stage."
  proficiency: "Domain-specific prior knowledge, assessed separately; an adult can be a novice."
  capability: "CAP-01-CAP-06: educator capabilities."
  legacy_policy: "Legacy metadata remains unreviewed; an alias changes resolution, not trust."

dimensions:
  stages:
    - id: "S0"
      code: "prenatal-caregiver"
      name: "Thai giáo & Caregiver Readiness"
      age_range: "Conception to Birth"
      focus: "Môi trường thần kinh học, sức khỏe người mẹ, responsive caregiving, dẹp bỏ pseudo-science"
    - id: "S1"
      code: "early-childhood"
      name: "Mầm non (0-6 tuổi)"
      age_range: "0-6 years"
      focus: "Attachment, Play-based learning, Executive functions, Language immersion, Reggio/Montessori"
    - id: "S2"
      code: "primary"
      name: "Tiểu học (6-11 tuổi)"
      age_range: "6-11 years"
      focus: "Foundational literacy/numeracy, Concrete-to-representational, Explicit Instruction, Habit formation"
    - id: "S3"
      code: "secondary"
      name: "Trung học cơ sở & Phổ thông (11-18 tuổi)"
      age_range: "11-18 years"
      focus: "Abstract reasoning, Disciplinary thinking, Metacognition, Inquiry, Identity & Agency"
    - id: "S4"
      code: "tertiary"
      name: "Đại học (18-22 tuổi)"
      age_range: "18-22 years"
      focus: "Cognitive apprenticeship, Active learning, Epistemic fluency, Professional competencies"
    - id: "S5"
      code: "postgraduate-doctoral"
      name: "Sau đại học & Tiến sĩ"
      age_range: "Postgraduate"
      focus: "Independent knowledge creation, Research supervision, Epistemological rigor, Critical peer defense"
    - id: "S6"
      code: "lifelong-adult"
      name: "Người trưởng thành & Suốt đời"
      age_range: "Adults"
      focus: "Andragogy, Heutagogy, Self-directed learning, Workplace transfer, Unlearning/Relearning"
    - id: "S7"
      code: "master-pedagogy"
      name: "Giáo sư Sư phạm & Đào tạo Giảng viên"
      age_range: "Educators of Educators"
      focus: "Scholarship of Teaching & Learning (SoTL), Teacher coaching, Systemic leadership, Paradigm synthesis"

  axes:
    - id: "AX-01"
      name: "Learning Sciences & Cognitive Neuroscience"
      topics: ["Working memory", "Cognitive load theory", "Dual coding", "Spaced retrieval", "Schema formation"]
    - id: "AX-02"
      name: "Developmental & Motivational Psychology"
      topics: ["Self-Determination Theory", "Zone of Proximal Development", "Executive Function", "Mindset", "Agency"]
    - id: "AX-03"
      name: "Instructional Design & Pedagogical Frameworks"
      topics: ["Explicit Instruction", "Inquiry-Based", "PBL", "Direct Instruction (Engelmann)", "Socratic dialogue"]
    - id: "AX-04"
      name: "Curriculum Theory & Progressions"
      topics: ["Backward Design (UbD)", "Constructive Alignment (Biggs)", "Spiral Curriculum (Bruner)", "Disciplinary literacy"]
    - id: "AX-05"
      name: "Assessment & Psychometrics"
      topics: ["Formative assessment (Black & Wiliam)", "Validity & Reliability (AERA/APA)", "Rubric design", "Diagnostic probes"]
    - id: "AX-06"
      name: "Inclusion & Universal Design for Learning (UDL)"
      topics: ["CAST UDL 3.0", "Neurodivergence (ADHD, Autism)", "Differentiated instruction", "Culturally responsive teaching"]
    - id: "AX-07"
      name: "Educational Technology & AI Pedagogy"
      topics: ["UNESCO AI Competency for Teachers", "Generative AI co-learning", "Intelligent tutoring", "Prompt ergonomics"]
    - id: "AX-08"
      name: "Ethics, Liberal Arts & Human Flourishing"
      topics: ["Critical Pedagogy (Freire)", "Ethical reasoning", "Epistemic humility", "Civic responsibility"]

  capabilities:
    - id: "CAP-01"
      name: "Diagnose Learner & Context"
      description: "Phân tích prior knowledge, cognitive load, misconception, neurodivergence trước khi dạy"
    - id: "CAP-02"
      name: "Design Rigorous Instruction"
      description: "Thiết kế bài giảng có scaffolding, worked examples, formative checkpoints, constructive alignment"
    - id: "CAP-03"
      name: "Deliver & Facilitate (Teach)"
      description: "Điều phối lớp học, Socratic questioning, explain concepts with dual coding, classroom culture"
    - id: "CAP-04"
      name: "Assess, Adapt & Intervene"
      description: "Bắt signal hiểu nhầm theo thời gian thực, điều chỉnh pacing, can thiệp targeted feedback"
    - id: "CAP-05"
      name: "Coach Teachers & Supervise Research"
      description: "Quan sát giảng viên, feedback theo mô hình micro-teaching, hướng dẫn nghiên cứu tiến sĩ"
    - id: "CAP-06"
      name: "Advance SoTL & Lead Systems"
      description: "Thực hiện nghiên cứu thực nghiệm sư phạm, cải cách chương trình đào tạo quốc gia/đại học"

  evidence_levels:
    - grade: "A"
      label: "Appraised synthesis of rigorous replicated studies; quality is independent of effect magnitude or direction"
    - grade: "B"
      label: "Appraised experimental or quasi-experimental evidence with credible controls"
    - grade: "C"
      label: "Preliminary, observational, correlational or context-limited empirical evidence"
    - grade: "D"
      label: "Expert consensus & Institutional frameworks (APA, OECD, UNESCO, Advance HE)"
    - grade: "E"
      label: "Classic Canon / Theory / Philosophical tradition (Piaget, Vygotsky, Dewey)"
    - grade: "U"
      label: "Unappraised or insufficiently documented evidence; not a verdict that a claim is false"

claim_statuses: ["unreviewed", "supported", "mixed", "not-supported", "refuted", "not-applicable"]
review_statuses: ["unreviewed", "source-checked", "reviewed"]
provenance_kinds: ["unreviewed", "literature", "authored", "simulation", "observed"]
