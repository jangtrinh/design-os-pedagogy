      "body_md": "Bốn hàm còn lại trong nhóm \"cần cho các lab sắp tới\" đều dễ hiểu nếu em hỏi: *nó nhớ gì, và khi nào nó đổi trạng thái?*\n\n- **Latching relay (RS)**: S đặt Q lên 1 và Q *giữ* 1 sau khi S nhả; R đưa Q về 0. Nếu S = R = 1 cùng lúc thì **R thắng** (Q = 0). Đây là cách \"tự giữ\" bằng một khối, thay cho tiếp điểm tự giữ của mạch rơ-le. Quy tắc ưu tiên là *R thắng khi cả hai cùng bằng 1*, không phải \"ai đến trước thắng\".\n- **Pulse relay**: mỗi *cạnh lên* của Trg đảo trạng thái Q (bật rồi tắt, rồi bật…): một nút nhấn làm công tắc bật/tắt luân phiên. S = 1 ép Q = 1, R = 1 ép Q = 0, và khi S hoặc R đang bằng 1 thì Trg bị bỏ qua. Tham số cho biết R hay S ưu tiên khi cả hai cùng bằng 1.\n- **Asynchronous pulse generator**: khi En = 1, Q lặp lại: bật trong TH, tắt trong TL; INV = 1 đảo pha. Dùng cho đèn nhấp nháy. Giáo trình không nêu Q khi En = 0, hãy quan sát trên mô phỏng.\n- **Up/down counter**: mỗi cạnh lên ở Cnt đếm thêm 1 (Dir = 0 đếm lên, Dir = 1 đếm xuống), R = 1 đưa bộ đếm về 0. Hai ngưỡng On và Off quyết định Q; trong bài này hãy đặt On = Off = số cần báo, khi đó Q = 1 từ lúc đếm đạt số đó. Cảm biến đứng yên ở mức 1 chỉ tính là *một* lần đếm vì chỉ cạnh lên mới được đếm.\n\nMô phỏng dưới đây chỉ minh họa Latching relay với nhãn S và R chung chung. Hãy thử: bấm S rồi nhả, bấm R rồi nhả, rồi giữ cả hai cùng lúc.",
