      "id": "B2-s2",
      "title": "BF: AND, OR, NOT, NAND, NOR, XOR và hàm theo cạnh",
      "items": [
        "2.1"
      ],
      "body_md": "BF là các hàm logic không có trí nhớ: ngõ ra chỉ phụ thuộc giá trị các ngõ vào ở thời điểm hiện tại. Từ mạch rơ-le em đã biết, ánh xạ nhanh như sau: **tiếp điểm nối tiếp = AND**, **tiếp điểm song song = OR**, **tiếp điểm thường đóng = NOT** (đảo mức). Ví dụ của bài này: hai nút S1 song song điều khiển một đèn chính là OR.\n\n- **AND**: Q = 1 khi *tất cả* ngõ vào bằng 1 (tối đa 4 ngõ vào). Dùng cho điều kiện đồng thời, ví dụ nút Start và cảm biến an toàn.\n- **OR**: Q = 1 khi *ít nhất một* ngõ vào bằng 1. Dùng cho hai nút nhấn song song.\n- **NOT**: Q là đảo của ngõ vào. Dùng để đảo tiếp điểm thường đóng.\n- **NAND**: ngược với AND, Q = 0 chỉ khi tất cả bằng 1.\n- **NOR**: Q = 1 chỉ khi tất cả bằng 0. Dùng cho \"cho phép chạy khi không có tín hiệu dừng nào\".\n- **XOR**: Q = 1 khi hai ngõ vào *khác nhau*. Dùng cho công tắc hai vị trí.\n\n**Mức và cạnh.** Các hàm ở trên làm việc theo *mức*: Q giữ nguyên chừng nào tổ hợp ngõ vào còn giữ nguyên. Riêng AND và NAND còn có phiên bản **theo cạnh** (edge): ngõ ra chỉ bằng 1 đúng *một chu kỳ quét* tại thời điểm điều kiện vừa xuất hiện (AND cạnh: tổ hợp vừa chuyển từ không đủ sang đủ cả 1; NAND cạnh: tổ hợp vừa chuyển từ cả 1 sang có ít nhất một ngõ vào về 0). Dùng để đếm đúng một lần cho mỗi lần nhấn hay mỗi lần vật đi qua.\n\nThử ngay: trong mô phỏng bên dưới, nhấn giữ S1, nhả S1, rồi bật công tắc S2 và quan sát giản đồ thời gian. Mô phỏng này chỉ minh họa khối OR; việc em tự làm trong phần mềm và trên kit ở phần thực hành.",
