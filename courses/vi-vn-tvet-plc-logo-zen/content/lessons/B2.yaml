      "body_md": "**LOGO!Soft Comfort** (LSC) là phần mềm trên máy tính để vẽ chương trình, mô phỏng và sau đó nạp xuống LOGO!. Lớp dùng **V8.4** ngôn ngữ **FBD** (sơ đồ khối chức năng), trên Windows 10 hoặc 11.\n\n**Cài đặt.** Chỉ cài từ bộ cài **hợp lệ do nhà trường cung cấp**, không tải bản không rõ nguồn hay bản bẻ khóa. Chạy tệp cài đặt, chọn ngôn ngữ, chấp nhận điều khoản bản quyền, chọn nhóm chương trình và thư mục, bấm Install rồi Finish. Giáo trình mô tả cài V7 rồi nâng cấp lên V8.1; lớp dùng bộ cài V8.4 nên làm theo hướng dẫn của giáo viên, không theo ảnh trong giáo trình.\n\n**Sử dụng.**\n\n1. Khởi động từ Start, nhóm Siemens, LOGO!Soft Comfort. Kiểm tra phiên bản ở Help, About.\n2. File, New: chọn **FBD**, chọn *loại thiết bị đúng với nhãn trên kit* (ví dụ LOGO! 12/24RCE), điền tên dự án và người tạo, bấm OK.\n3. Soạn: nhấp đúp hoặc kéo-thả khối từ thư viện bên trái (nhóm **Co**, **BF**, **SF**) vào vùng soạn thảo.\n4. Nối khối bằng công cụ **Connect (F5)**: kéo từ ngõ ra của một khối đến ngõ vào của khối khác. Nhớ quy tắc: một ngõ ra nối được nhiều ngõ vào, nhưng không nối nhiều ngõ ra vào cùng một ngõ vào.\n5. Mô phỏng: **Tools, Simulation (F3)**. Đóng/mở các công tắc ảo ở ngõ vào, quan sát ngõ ra và giản đồ.\n6. Lưu: File, Save (hoặc Save as). Mở lại: File, Open.\n\nHai phím dễ nhầm: **F5 để nối dây (Connect)**, **F3 để chạy mô phỏng (Simulation)**. Phần truyền chương trình từ máy xuống LOGO! và giám sát khi chạy thật không thuộc bài này; giáo viên sẽ hướng dẫn ở buổi sau nếu kit có cáp.",
