      "body_md": "Mọi chương trình LOGO! được ghép từ ba nhóm khối trong thư viện: **Co** (đầu nối, Connectors), **BF** (hàm cơ bản, Basic Functions) và **SF** (hàm đặc biệt, Special Functions). Giáo trình có chỗ ghi nhầm \"GF\", đó là lỗi đánh máy của BF.\n\nNhóm **Co** là chỗ chương trình chạm vào thế giới thật: **I** là tín hiệu từ nút nhấn, cảm biến đi vào; **Q** là lệnh đi ra đóng rơ-le cho đèn, cuộn K. So với mạch rơ-le em đã học: nút S1 tương ứng I1, cuộn K1 hoặc đèn E1 tương ứng Q1, còn các dây nối giữa tiếp điểm và cuộn chính là các khối BF và SF.\n\nHai điểm hay gây lỗi nhất ở nhóm này:\n\n- **hi và lo** chỉ là hằng 1 và 0, nối cứng vào ngõ vào của khối khi cần ép mức.\n- **x** là đầu nối hở (không dùng). LOGO! tự gán cho x một giá trị sao cho *không làm đổi kết quả của khối*: với **AND** và **NAND** thì x = 1, với **OR**, **NOR**, **XOR** thì x = 0. Vì vậy ngõ vào không dùng của OR phải ghi x, không phải để trống.\n\nKit mẫu của lớp (giả định LOGO! 12/24RCE) có ngõ vào I1 đến I8 và 4 ngõ ra rơ-le Q1 đến Q4; lắp thêm module DM8 thì có tổng 8 ngõ ra. Hãy đọc nhãn trên kit của nhóm trước khi nối dây.",
