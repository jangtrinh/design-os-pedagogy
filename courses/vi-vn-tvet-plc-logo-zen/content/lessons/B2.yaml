      "id": "B2-s7",
      "title": "Lập trình trực tiếp trên LOGO! bằng phím",
      "items": [
        "2.3"
      ],
      "body_md": "LOGO! có màn hình và các phím: **bốn phím mũi tên** (trái, phải, lên, xuống), **ESC** và **OK**. Chương trình có thể nhập thẳng bằng phím mà không cần máy tính. Các bước dưới đây theo giáo trình; ký hiệu phím trong giáo trình bị mất khi in nên giáo viên sẽ chỉ ra tổ hợp phím đúng trên kit của lớp (kit đời LOGO! 8 có thể khác mô tả ở chi tiết menu).\n\n**Vào menu.** Cấp nguồn. Trên LOGO! 8 (kit của lớp), khi chưa có chương trình màn hình hiện \"No Program / Press ESC\": nhấn **ESC** để vào menu chính (Start/Stop, Program, Setup, Card…). Khi LOGO! đang chạy, nhấn ESC cũng mở menu. Giáo trình mô tả cách vào menu bằng *tổ hợp ba phím* (mũi tên và OK) cùng menu Program, PC/Card, Clock, Start: đó là cách của các đời LOGO! cũ; nếu kit của nhóm là đời cũ thì làm theo giáo trình.\n\n**Đặt đồng hồ (Set Clock).** Trên LOGO! 8: Setup → Clock → Set Clock (đời cũ: mục Clock ở menu chính). Vào Set Clock, chọn thứ trong tuần (SU, MO, TU, WE, TH, FR, SA) bằng phím mũi tên rồi OK, chỉnh giờ hh.mm bằng phím mũi tên rồi OK, kết thúc bằng OK.\n\n**Xóa chương trình (Clear Prg).** Program, Clear Prg, OK, chọn YES để xóa hoặc NO để hủy, rồi OK. Làm bước này trước khi nhập chương trình mới để khỏi lẫn khối cũ.\n\n**Nhập chương trình (Edit Prg).** Program → Edit → Edit Prg, OK (đời cũ: Program → Edit Prg); màn hình hiện Q1 (phím lên/xuống đổi sang Q2, Q3…). *Lập trình từ ngõ ra về phía ngõ vào*, tức từ phải sang trái so với sơ đồ. Con trỏ gạch chân dùng để di chuyển; nhấn OK thì con trỏ thành khối đậm nhấp nháy để chọn. Chọn nhóm Co, BF hoặc SF, chọn khối; LOGO! đánh số khối B01, B02… Rồi lần lượt nối từng ngõ vào của khối đó với một Co (ví dụ I1) hoặc khối khác. Ngõ vào không dùng ghi **X**. Xong thì nhấn OK để chốt, dùng phím mũi tên duyệt lại cấu trúc.\n\n**Chạy (Start).** Nhấn ESC (hai lần nếu cần) để về menu chính, chọn Start, OK; LOGO! vào chế độ Run và hiển thị trạng thái ngõ vào/ngõ ra.\n\n**Bốn nguyên tắc vàng.**\n\n1. Biết cách vào menu trên đúng đời thiết bị: LOGO! 8 dùng ESC; đời cũ dùng tổ hợp ba phím (giáo trình). Chỉnh thông số khi đang chạy cũng đi qua menu.\n2. Lập trình từ ngõ ra đến ngõ vào; một ngõ ra nối được nhiều ngõ vào, *không* nối nhiều ngõ ra vào một ngõ vào.\n3. Con trỏ gạch chân là di chuyển, OK là chọn, ESC là thoát hoặc lùi một bước; con trỏ khối đậm là đang chọn khối hay đầu nối.\n4. LOGO! chỉ lưu chương trình đã hoàn tất, nên hoàn tất chương trình trước khi thoát.\n\n**Ví dụ OR (S1 song song S2 điều khiển Q1).** Mạch rơ-le có hai nút S1 và S2 mắc song song đóng điện cho đèn E1 (hoặc cuộn K1). Trên LOGO!, S1 nối I1, S2 nối I2, đèn nối Q1, và logic là một khối OR có ngõ vào I1, I2, ngõ vào thứ ba ghi X. Em sẽ xem giáo viên làm mẫu từng bước trong ví dụ có lời giải, rồi tự làm ở phần thực hành.",
