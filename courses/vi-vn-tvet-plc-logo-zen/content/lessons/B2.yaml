      "id": "B2-s3",
      "title": "SF định thời: On-delay và Off-delay",
      "items": [
        "2.1"
      ],
      "body_md": "Khác BF, các **hàm đặc biệt (SF)** có *trí nhớ* và thường có tham số. Hai hàm định thời dưới đây là nền của bài đèn giao thông, cửa tự động và băng tải ở các buổi sau. Chung các ký hiệu: **Trg** (Trigger) là ngõ vào kích, **T** là thời gian đặt, **Ta** là thời gian đã đếm, **Q** là ngõ ra, **R** (Reset) xóa hàm.\n\n**On-delay (trễ khi bật).** Cạnh lên của Trg (0 sang 1) bắt đầu đếm Ta. Nếu Trg còn bằng 1 khi Ta chạm T thì Q = 1. Nếu Trg về 0 *trước khi* Ta đạt T thì Ta bị reset về 0 và Q vẫn bằng 0. Hãy nhớ: On-delay *không tạm dừng* mà *làm lại từ đầu*. Dùng khi cần \"giữ nút đủ lâu mới chạy\" hoặc chuyển Y sang Δ sau T giây.\n\n**Off-delay (trễ khi tắt).** Q = 1 ngay khi Trg = 1. Thời gian đếm bắt đầu ở *cạnh xuống* của Trg (1 sang 0); khi Ta chạm T thì Q = 0. Ngõ vào R, nếu bằng 1, xóa ngay Q và Ta. Dùng khi cần \"nhả nút rồi vẫn chạy thêm T giây\", ví dụ đèn hành lang, băng tải chạy nốt hàng.\n\n**Rem** (Retentivity) là tham số giữ trạng thái của hàm khi mất nguồn; không liên quan đến việc Trg bị ngắt tạm thời.\n\nTrong mô phỏng, hai khối cùng nhận I1 với T = 3 giây. Hãy: (1) giữ I1 chưa đầy 3 giây rồi nhả, xem Q1 (On-delay) và Q2 (Off-delay); (2) giữ I1 hơn 3 giây rồi nhả; (3) đoán trước giản đồ rồi mới thử. Giáo trình mô tả Off-delay chưa nhất quán khi Trg lên lại giữa lúc đang đếm; em chỉ cần thử và ghi lại quan sát trên phần mềm, chưa coi đó là quy tắc.",
