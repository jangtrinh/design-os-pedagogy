        "Giới thiệu chương trình mô đun"
      ],
      "body_md": "**Mô đun \"Điều khiển lập trình cỡ nhỏ\"** dạy bạn dùng hai loại bộ điều khiển logic nhỏ gọn (programmable relay): Siemens LOGO! và Omron ZEN. Bạn đã học Khí cụ điện, Trang bị điện và PLC, nên mô đun này đi thẳng vào việc: chọn thiết bị, đấu nối an toàn, lập trình bằng ngôn ngữ khối chức năng (FBD) và chạy thử trên kit thật.\n\n**Khung thời gian.** Tổng 60 giờ: 14 giờ lý thuyết, 42 giờ thực hành, 4 giờ thi kết thúc mô đun. Học trong 15 tuần, mỗi tuần một buổi 4 giờ. Tuần 1 đến 10 học LOGO! (bài B1 đến B6), tuần 11 đến 14 học ZEN (bài B7 đến B9), tuần 15 thi.\n\n**Bạn sẽ làm được gì khi kết thúc.** Nhận biết ngõ vào/ra của LOGO! và ZEN; mô tả các thành phần phần mềm và các lệnh; lập trình được hệ thống điều khiển cơ bản; kết nối nguồn và thiết bị ngoài đúng và an toàn; cẩn thận, chính xác, giữ an toàn cho người và thiết bị.\n\n**Cách tính điểm.** Điểm kiểm tra thường xuyên có hệ số 1, điểm kiểm tra định kỳ có hệ số 2. Có hai kiểm tra định kỳ (KTĐK) thực hành trên kit: KTĐK1 ở tuần 10 (LOGO!, phạm vi B1 đến B6) và KTĐK2 ở tuần 14 (ZEN, phạm vi B7 đến B9). Điểm trung bình kiểm tra (ĐTBKT) = (tổng điểm thường xuyên × 1 + tổng điểm định kỳ × 2) chia cho (số bài thường xuyên + 2 × số bài định kỳ). **Điểm mô đun = 0,4 × ĐTBKT + 0,6 × điểm thi kết thúc.** Thang 10, làm tròn 1 chữ số thập phân, đạt khi từ 5,0 trở lên.\n\n**Điều kiện dự thi.** Đi học từ 80% số giờ trở lên **và** ĐTBKT từ 5,0 trở lên. Thiếu một trong hai điều kiện là không được dự thi, dù điểm trung bình các bài khác cao.",
