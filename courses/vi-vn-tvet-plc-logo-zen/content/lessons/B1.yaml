    {
      "id": "B1-s2",
      "title": "LOGO! là gì và dùng vào việc gì",
      "items": [
        "1.1"
      ],
      "body_md": "**LOGO!** là mô-đun logic (logic module) của Siemens dành cho các bài toán điều khiển đơn giản: đèn cầu thang, chiếu sáng nhà xưởng, băng tải ngắn, bơm cấp nước, chuông báo. Một thiết bị nhỏ thay cho cả một dãy rơ-le trung gian, rơ-le thời gian và dây nối trong tủ, nên giảm chi phí, số mối nối và không gian tủ.\n\n**Vì sao dùng thay mạch rơ-le cứng?** Trong mạch rơ-le cứng, muốn đổi thời gian trễ từ 30 giây thành 45 giây bạn phải chỉnh hoặc thay rơ-le thời gian; muốn thêm một nút nhấn song song bạn phải đi dây thêm. Với LOGO!, hai việc đó là sửa chương trình trong phần mềm **LOGO!Soft Comfort** rồi nạp xuống. Mạch \"S1 song song S2 cùng điều khiển một đèn\" trở thành một khối **OR** trong chương trình (xem mô phỏng bên dưới).\n\n**Phần cứng tích hợp sẵn**: nguồn nuôi, bộ định thời (timer), tạo xung, đồng hồ thời gian thực (ngày/tuần/tháng/năm) ở các loại có đồng hồ, vùng nhớ trung gian (marker), cổng nối với máy tính; nhiều loại có màn hình và phím để xem/sửa ngay trên thiết bị.\n\n**Phân loại theo điện áp nguồn/ngõ vào**: 12 VDC, 24 VDC, 24 VAC/DC và 115/230 VAC. **Phân loại theo ngõ ra**: relay hoặc transistor. Mỗi loại có điện áp và loại tải phù hợp riêng, và đây là chỗ dễ nhầm nhất khi mới học (xem mục 3 và 4).\n\n**Mở rộng**: ghép thêm module số (DM) hoặc tương tự (AM) để tăng số ngõ vào/ra. Số lượng tối đa phụ thuộc thế hệ thiết bị, tra catalogue của đúng model bạn dùng.\n\n> **Lưu ý an toàn**: LOGO! là thiết bị điều khiển, **không** thay thế mạch dừng khẩn cấp và các thiết bị bảo vệ (cầu chì, rơ-le nhiệt, aptomat) của hệ thống. Nút dừng khẩn cấp phải cắt điện bằng phần cứng, độc lập với chương trình.\n\n**Kit dùng trong mô đun này (giả định, giáo viên sẽ xác nhận):** LOGO! 12/24RCE (8 ngõ vào số, 4 ngõ ra relay) cùng module mở rộng DM8 12/24R (4 vào, 4 ra relay), lập trình bằng LOGO!Soft Comfort V8.4 ngôn ngữ FBD.",
