      "body_md": "**Ngõ vào (I)**: công tắc hoặc nút nhấn nối từ đầu cấp điện của đúng điện áp model vào đầu I. Đóng công tắc thì có điện áp giữa I và cực chung, ngõ vào lên mức 1. Model 230 VAC: nối từ L1 vào I, dây N nối về cực N của nguồn để khép mạch. Model DC: nối từ L+ vào I, cực chung nối M (0 V).\n\nNgưỡng tham khảo của model 230 VAC theo giáo trình: mức 0 khi điện áp từ 40 V trở xuống, mức 1 khi từ 79 V trở lên. Vì thế đóng công tắc có ~230 V vào I3 thì I3 chắc chắn lên 1. **Nhưng đừng suy ra 230 V là \"càng lớn càng an toàn\"**: đưa 230 V vào model 24 V sẽ làm hỏng ngõ vào, và đưa 24 V vào model 230 V thì ngõ vào không lên mức 1. Giá trị ngưỡng chính xác của model 12/24 V xem datasheet của đúng thế hệ thiết bị.\n\n**Ngõ ra relay (R)**: mỗi ngõ Q có hai đầu tiếp điểm khô, **cách ly** với nguồn và ngõ vào. Tải có thể dùng nguồn khác, xoay chiều hay một chiều, miễn trong định mức tiếp điểm. Cần cầu chì ngoài cho mạch tải.\n\n**Ngõ ra transistor (không R)**: các ngõ Q **dùng chung nguồn 24 VDC** với LOGO!, tải nối giữa Q và cực M (0 V). Mỗi ngõ chỉ chịu 0,3 A và có bảo vệ quá tải/ngắn mạch. Tải lớn hơn 0,3 A, hoặc tải xoay chiều, phải đi qua relay hay contactor trung gian có cuộn dòng nhỏ hơn 0,3 A. Với tải cảm một chiều cần mạch dập xung (diode hoặc RC), đây là kiến thức bổ sung ngoài giáo trình.\n\n**Cạm bẫy khi đo ngõ vào 230 V**: dòng ngõ vào rất nhỏ (cỡ vài phần mười mA), nên đồng hồ số trở kháng cao (hoặc đèn báo mắc song song) có thể cho điện áp \"ma\" dù không có điện áp thật. Muốn kết luận, đo lại khi có tải thử (đèn thử hoặc điện trở).",
