      "body_md": "Mã model in trên vỏ cho biết gần như mọi thứ bạn cần trước khi cấp điện: **nguồn và ngõ vào là bao nhiêu volt**, **ngõ ra là relay hay transistor**, có đồng hồ và có màn hình hay không. Hãy tập đọc mã theo từng cụm.\n\nVí dụ **LOGO! 230RCo**: 230 (nguồn và ngõ vào 115/230 VAC), R (ngõ ra relay), C (có đồng hồ thời gian thực/định thời), o (không có màn hình). Còn **LOGO! 24** (không có chữ R) có ngõ ra **transistor**, nguồn 24 VDC.\n\n**Cách đọc nhanh**: nhìn con số đầu để biết điện áp, nhìn chữ R để biết relay hay transistor, rồi mới nhìn các chữ cái còn lại. Đọc nhầm chữ R dẫn tới chọn sai loại tải: relay đóng cắt được tải xoay chiều lẫn một chiều, còn transistor chỉ chịu dòng rất nhỏ.\n\n**Điều kiện của dòng relay.** Với LOGO! 12/24RCE, mỗi ngõ ra relay chịu tối đa 10 A khi tải thuần trở (đèn sợi đốt, điện trở sưởi) nhưng chỉ 3 A khi tải cảm (cuộn contactor, động cơ nhỏ). Relay không có bảo vệ ngắn mạch bên trong, nên phải lắp **cầu chì ngoài**.",
