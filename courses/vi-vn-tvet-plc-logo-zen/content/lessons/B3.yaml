      "body_md": "Ngõ ra Q của LOGO! (bộ cơ sở có đuôi R, ví dụ 12/24RCE) là **tiếp điểm rơ-le** khô. Với bộ cơ sở được giả định cho lớp này, định mức nhà sản xuất thường nêu là **10 A với tải thuần trở** và **3 A với tải cảm**; đây là giá trị cần đối chiếu với nhãn và datasheet của thiết bị thật. Ngõ ra rơ-le **không có bảo vệ ngắn mạch**: mạch phải có cầu chì hoặc CB phía ngoài.\n\n**Động cơ là tải cảm** và có dòng khởi động lớn (thường gấp vài lần dòng định mức). Hồ quang mỗi lần đóng cắt làm mòn hoặc làm dính tiếp điểm. Động cơ ba pha còn cần ba tiếp điểm đóng cắt đồng thời, trong khi mỗi ngõ ra Q chỉ là một tiếp điểm riêng. Vì vậy **không bao giờ đấu động cơ trực tiếp vào ngõ ra Q**.\n\nGiải pháp là dùng **contactor** (hoặc rơ-le trung gian) làm khâu trung gian: LOGO! chỉ đóng cắt cuộn dây A1-A2, một tải nhỏ; tiếp điểm chính của contactor, được chọn theo loại sử dụng cho động cơ, mới đóng cắt dòng của động cơ.\n\nKhi nối ngõ ra Q với cuộn dây contactor, hãy kiểm tra:\n\n- **Điện áp cuộn dây** phải khớp với nguồn cấp cho tiếp điểm Q (24 V DC, 24 V AC hay 230 V AC). Nếu cuộn dây là 230 V AC thì mạch ngõ ra là điện lưới: chỉ giáo viên đấu hoặc kiểm tra.\n- **Dòng cuộn dây** (đọc nhãn, thường rất nhỏ so với 3 A) phải nằm trong định mức tải cảm của tiếp điểm Q.\n- **Dập quá áp** khi ngắt cuộn dây: cuộn dây một chiều thường cần diode mắc song song ngược chiều, cuộn xoay chiều thường cần mạch RC. Nhiều contactor có sẵn module dập, hãy hỏi giáo viên.\n\nCác số liệu trên là giả định theo bộ LOGO! 12/24RCE, chờ giáo viên xác nhận trên kit thực tế.",
