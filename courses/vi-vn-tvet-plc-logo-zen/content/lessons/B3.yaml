    {
      "id": "B3-s2",
      "title": "Chuyển sang PLC: nút dừng và tiếp điểm quá tải đấu thường đóng",
      "items": [
        "3.1"
      ],
      "body_md": "Khi đưa mạch điều khiển vào PLC, các tiếp điểm ngoài không còn mắc nối tiếp với cuộn dây nữa. Mỗi thiết bị chỉ báo cho **ngõ vào số (digital input)** biết một điều: có điện áp (1) hay không có (0). Chương trình mới quyết định phần còn lại.\n\n**Vì sao nút dừng và tiếp điểm quá tải đấu thường đóng (NC)?** Đây là nguyên tắc **an toàn khi hỏng (fail-safe)**. Nếu S2 đấu thường đóng thì khi đứt dây, lỏng đầu nối hay mất nguồn cấp cho nút, ngõ vào về 0 và chương trình hiểu là \"có lệnh dừng\": máy dừng. Nếu S2 đấu thường hở thì đứt dây làm nút dừng \"câm\": nhấn S2 không còn tác dụng và không ai biết. Với nút mở máy S1 thì ngược lại: đứt dây chỉ làm máy không chạy được, vô hại, nên dùng thường hở. Tiếp điểm quá tải F cũng vậy: dùng tiếp điểm thường đóng (95-96) để dây đứt được coi là sự cố.\n\n**Hệ quả với logic chương trình.** Tiếp điểm thường đóng, chưa tác động thì mạch kín nên ngõ vào đọc **1**; nhấn nút (hoặc F tác động, hoặc đứt dây) thì mạch hở, ngõ vào đọc **0**. Vậy \"tín hiệu dừng\" của S2 là ngõ vào bằng 0, ngược với suy nghĩ quen thuộc \"nhấn = 1\". Có hai cách viết cùng một ý:\n\n- Dùng thẳng ngõ vào làm điều kiện **cho phép chạy**: máy chỉ được chạy khi ngõ vào đó bằng 1 (đưa vào cổng AND).\n- Dùng cổng NOT để đổi thành tín hiệu **lệnh dừng** (bằng 1 khi có lệnh dừng) rồi đưa vào chân dừng của khối.\n\nCách nào cũng được, nhưng cả nhóm phải ghi rõ trong bảng I/O để mọi người đọc cùng một nghĩa. Lỗi hay gặp là viết logic như thể S2 thường hở (nhấn = 1) trong khi dây đấu thường đóng.\n\n**Thử với ví dụ mẫu 1 (quạt thông gió, xem phần ví dụ có lời giải).** Trong mô phỏng bên dưới, hãy bật công tắc I2 trước (nút dừng chưa nhấn nên đọc 1). Nhấn rồi thả I1 và quan sát Q1. Sau đó tắt I2 (giả lập nhấn dừng hoặc đứt dây) và thử nhấn I1.\n\n**Mất điện rồi có điện lại với PLC.** Khi LOGO! vừa có điện, ngõ ra bắt đầu ở 0 và S1 chưa nhấn nên động cơ chưa chạy. Chú ý: một số khối nhớ của LOGO! có tham số nhớ trạng thái qua mất điện (retentivity, ký hiệu Rem). Với động cơ, không dùng tính năng này để động cơ không tự chạy lại. Hãy kiểm chứng hành vi này bằng mô phỏng và trên kit, vì chưa có xác nhận của giáo viên.",
