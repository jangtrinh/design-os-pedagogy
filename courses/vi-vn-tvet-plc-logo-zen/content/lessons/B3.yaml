      "body_md": "Bài này không đưa chương trình mẫu cho bài tập. Thay vào đó bạn đi theo **sáu bước** có thể dùng cho mọi bài điều khiển:\n\n1. **Lập bảng I/O:** địa chỉ, thiết bị, loại tiếp điểm, giá trị khi bình thường (xem bảng ở phần 3.3).\n2. **Mô tả hành vi dưới dạng bảng trạng thái:** mỗi dòng là một tình huống (các ngõ vào và trạng thái ngõ ra trước đó), cột kết quả là ngõ ra mong muốn. Điền bằng giá trị 0 và 1, đọc nút thường đóng đúng như phần 3.1.\n3. **Chọn khối:** nhìn bảng trạng thái. Dòng nào cho thấy ngõ ra phụ thuộc vào chính trạng thái trước đó của nó? Khi đó cần một cách ghi nhớ: hồi tiếp ngõ ra về đầu vào khối, hoặc khối nhớ (Latching relay, đã học ở B2). Điều kiện dừng nào phải thắng? Cần cổng nào (AND, OR, NOT) để đổi nghĩa tín hiệu? Vẽ ra giấy trước khi đặt khối.\n4. **Mô phỏng:** trong LOGO!Soft Comfort chạy mô phỏng (phím F3), đặt nút thường đóng ở mức 1 lúc đầu, rồi chạy lần lượt **mọi dòng** của bảng trạng thái. Chỉ khi mô phỏng đúng mới nạp xuống.\n5. **Nạp xuống LOGO!** theo cách đã làm ở B2, và chạy thử **không tải** (chưa nối mạch động lực).\n6. **Kiểm tra theo danh sách (checklist)** bên dưới, ghi kết quả từng mục.\n\n**Hộp công cụ gợi ý:** cổng OR, AND, NOT và khối Latching relay. Ghi ý nghĩa mỗi ngõ vào ngay cạnh khối trên giấy để tránh nhầm nghĩa của tín hiệu thường đóng.\n\n**Danh sách kiểm tra khi chạy thử:**\n\n- Vừa cấp điện, chưa nhấn gì: động cơ có đứng yên không?\n- Nhấn S1 rồi thả: động cơ chạy và giữ?\n- Nhấn S2: động cơ dừng ngay? Nhấn đồng thời S1 và S2: động cơ có dừng không?\n- Giả lập quá tải: động cơ dừng và đèn báo sáng? Trong lúc đang quá tải, nhấn S1 thì sao?\n- Cắt nguồn một chốc rồi cấp lại: trạng thái động cơ và đèn là gì? Có đúng dự đoán của nhóm không?\n- Cắt nguồn, tháo một đầu dây của S2, cấp nguồn lại: nhấn S1 có làm động cơ chạy không? (Không được chạy.)\n- Chương trình đã lưu với tên rõ ràng?\n\n**Lỗi hay gặp và cách tìm:**\n\n- Viết logic như S2 thường hở trong khi dây đấu thường đóng (hoặc ngược lại):