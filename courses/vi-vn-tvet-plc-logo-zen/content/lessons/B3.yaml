      "id": "B3-s1",
      "title": "Mạch khởi động từ cổ điển: tự giữ, dừng ưu tiên, rơ-le nhiệt",
      "items": [
        "3.1"
      ],
      "body_md": "Trước khi lập trình, hãy đọc lại mạch mà PLC sẽ thay thế: **mạch khởi động từ đơn** dùng contactor K để đóng cắt một động cơ ba pha.\n\nMạch có hai phần. **Mạch động lực** (dòng lớn) đi từ CB qua tiếp điểm chính của K, qua phần tử nhiệt của rơ-le nhiệt F rồi đến động cơ M. **Mạch điều khiển** (dòng nhỏ, chỉ cấp cho cuộn dây K) gồm các phần tử mắc nối tiếp theo thứ tự: tiếp điểm thường đóng của F, nút dừng S2 (thường đóng), rồi hai nhánh song song là nút mở máy S1 (thường hở) và tiếp điểm phụ thường hở của K, cuối cùng là cuộn dây K.\n\n**Tự giữ (self-holding).** Nhấn S1, cuộn K có điện và hút. Contactor hút làm đóng luôn tiếp điểm phụ của K đang mắc song song với S1. Thả S1, dòng vẫn đi qua tiếp điểm phụ nên K vẫn có điện. Nếu thiếu nhánh này, contactor chỉ hút khi tay còn giữ trên S1.\n\n**Dừng ưu tiên.** S2 và tiếp điểm của F mắc nối tiếp với cả hai nhánh (S1 và tự giữ). Chỉ cần một trong hai mở, cuộn K mất điện, dù S1 đang nhấn hay tự giữ đang đóng. Nguyên tắc là \"dừng thắng khởi động\".\n\n**Rơ-le nhiệt (thermal overload relay).** Dòng quá tải kéo dài làm dải lưỡng kim trong rơ-le nóng lên, uốn cong và làm tiếp điểm tác động. Rơ-le nhiệt thường có một tiếp điểm thường đóng (đầu nối ký hiệu 95-96) đưa vào mạch điều khiển và một tiếp điểm thường hở (97-98) dùng để báo tín hiệu. Nó bảo vệ **quá tải kéo dài**, không bảo vệ ngắn mạch (việc đó thuộc CB hoặc cầu chì). Sau khi tác động phải chờ bimetal nguội rồi reset theo chế độ của rơ-le (tay hoặc tự động).\n\n**Mất điện rồi có điện lại.** Khi mất điện, K nhả và tiếp điểm tự giữ mở ra. Khi có điện lại, động cơ **không** tự chạy cho đến khi có người nhấn S1. Đây là đặc tính an toàn cần giữ nguyên khi chuyển sang PLC: người đang vệ sinh hoặc sửa máy trong lúc mất điện không bị máy tự chạy khi điện trở lại.\n\nGhi chú nguồn: nội dung này viết lại từ kiến thức khí cụ điện và trang bị điện đã học, đối chiếu với mục 3.1 của giáo trình nội bộ (giáo trình chỉ nêu đề bài, không giảng về tự giữ hay rơ-le nhiệt).",
