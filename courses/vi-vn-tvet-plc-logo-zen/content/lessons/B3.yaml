      "body_md": "**Bộ thiết bị giả định.** Lớp này giả định dùng bộ LOGO! 12/24RCE (nguồn một chiều 12/24 V, 8 ngõ vào số, 4 ngõ ra rơ-le), có thể kèm một module mở rộng. Đây là giả định chờ giáo viên xác nhận. **Hãy đọc nhãn trên thiết bị:** nếu là bản 230RC/230RCE (nguồn và ngõ vào 230 V xoay chiều) thì cách đấu và mức an toàn khác hẳn.\n\n**Cảnh báo về hình trong giáo trình.** Sơ đồ đấu dây ở mục 3.1.3 của giáo trình nội bộ là của một ví dụ khác (hai nút song song điều khiển một đèn, hay mạch OR), không có rơ-le nhiệt, contactor hay động cơ, và vẽ thiết bị ghi 12/24RC nhưng đấu vào L1/N 230 V. Vì vậy **không dùng hình đó để đấu**; hãy đấu theo bảng dưới đây và theo sơ đồ giáo viên xác nhận trên kit.\n\n**Nguyên tắc đấu (với bộ nguồn một chiều giả định):**\n\n1. Cấp nguồn 12/24 V DC cho LOGO! đúng cực, theo nhãn thiết bị.\n2. **Ngõ vào:** mỗi thiết bị (S1, S2, F) đấu từ cực dương nguồn (L+) qua tiếp điểm của nó đến một ngõ vào. Nút S1 dùng tiếp điểm thường hở; S2 và F dùng tiếp điểm thường đóng.\n3. **Ngõ ra:** tiếp điểm Q1 đóng cắt nguồn cấp cho cuộn dây contactor (A1-A2); tiếp điểm Q2 đóng cắt nguồn cấp cho đèn báo.\n4. **Mạch động lực** (CB, tiếp điểm chính contactor, phần tử nhiệt của F, động cơ): chỉ giáo viên đấu hoặc đấu dưới sự giám sát trực tiếp của giáo viên, sau khi mạch điều khiển đã chạy đúng khi không tải.\n5. Vỏ động cơ và thiết bị phải có tiếp địa; mạch phải có CB hoặc cầu chì.\n\n**Thứ tự an toàn:** cắt nguồn khi đấu dây, đấu mạch điều khiển trước, kiểm tra thông mạch bằng đồng hồ ở trạng thái bình thường (S2 và F phải thông, S1 phải hở), gọi giáo viên kiểm tra rồi mới cấp nguồn.\n\n**Giả lập quá tải.** Không làm nóng rơ-le nhiệt và không tạo quá tải thật. Cách giả lập an toàn: bấm nút thử (TEST) hoặc cần kích tác động có sẵn trên rơ-le nhiệt nếu giáo viên cho phép, hoặc dùng một công tắc thường đóng đặt nối tiếp thay vị trí F rồi mở nó ra. Sau khi F tác động phải reset rơ-le trước khi thử tiếp.",
