  "teacher_notes": [
    "CHƯA KIỂM CHỨNG: lời giải nháp của LOGO-LAB-1 nằm ở course.yaml (labs[].solution_outline) và chỉ là suy luận từ đề bài. Phải chạy thử trên đúng kit trước giờ dạy: bảng I/O, loại tiếp điểm của S2 và F, hành vi khi S = R = 1, trạng thái ngõ ra sau mất điện rồi cấp lại, và tham số nhớ (retentivity, Rem) của khối Latching relay trong LOGO!Soft Comfort V8.4 (bản này chưa kiểm). Không đưa lời giải này cho sinh viên.",
    "Hình ở mục 3.1.3 của giáo trình nội bộ là hình của ví dụ 1 (mạch OR của S1 và S2 điều khiển đèn Q1), không phải mạch start/stop, không có rơ-le nhiệt, contactor hay động cơ, và vẽ LOGO! 12/24RC nhưng đấu L1/N 230 V. Mục 3.1.4 của giáo trình để trống. Đừng dùng hình đó để đấu dây; hãy chuẩn bị sơ đồ đấu dây riêng cho kit và vẽ lên bảng. Xác nhận nhãn model (12/24RC hay 230RC) trước khi cấp điện.",
    "Giả lập quá tải: dùng nút TEST của rơ-le nhiệt (nếu cho phép) hoặc công tắc thường đóng thay F; trong mô phỏng đặt ngõ vào của F ở 0. Cấm hơ nóng rơ-le hay cho động cơ quá tải thật. Sau khi F tác động phải reset rơ-le trước khi thử tiếp.",
    "Định mức ngõ ra rơ-le (giả định LOGO! 12/24RCE: 10 A thuần trở, 3 A tải cảm, không có bảo vệ ngắn mạch) so với cuộn dây contactor: kiểm tra điện áp và dòng cuộn dây trên nhãn trước khi đấu. Nếu cuộn dây là 230 V AC thì mạch ngõ ra là điện lưới, chỉ GV đấu và kiểm tra. Xem có diode hoặc mạch RC dập quá áp chưa. Xác nhận số ngõ ra Q của kit có đủ Q1 và Q2 hay cần DM8.",
    "Tiêu chí mất nguồn đã được chốt khi rà soát: động cơ không được tự khởi động sau khi có điện lại; nếu nhóm bật Rem cho khối tự giữ và động cơ tự chạy lại thì chấm không đạt và phân tích nguy cơ.",
    "Hiểu lầm cần để ý: cho rằng nút thường đóng chưa nhấn thì ngõ vào bằng 0; viết NOT thừa cho tiếp điểm đã thường đóng; quên tự giữ; đặt tự giữ ngoài điều kiện dừng nên dừng không thắng; cho rằng đứt dây nút dừng thì máy vẫn chạy bình thường; đấu động cơ thẳng vào ngõ ra rơ-le; kiểm tra quá tải bằng cách làm nóng rơ-le.",
    "Khung thời gian của bước you_do (125 phút) gợi ý: 20 phút bảng I/O và bảng trạng thái; 25 phút đấu mạch điều khiển và đo thông mạch; 25 phút viết và mô phỏng; 10 phút GV kiểm tra; 30 phút nạp và chạy thử; phần còn lại là chạy thử có tải và ghi phiếu. Nếu thiếu kit, chia hai lượt luân phiên giữa giai đoạn đấu dây và giai đoạn lập trình trên máy.",
    "Nhóm thực hành tối đa 18 người theo Thông tư 04/2022 (nghề nguy hiểm 10); Thông tư 79/2026 hiệu lực 10/11/2026 nâng lên 25 và 15; ưu tiên quy chế nội bộ của trường. Cần xác nhận số sinh viên mỗi kit."
  ]
