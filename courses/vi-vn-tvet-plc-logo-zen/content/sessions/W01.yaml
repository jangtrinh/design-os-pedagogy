  "teacher_notes": [
    "AN TOÀN: dùng nguồn một chiều 24 V cho kit (không phải 230 V) khi sinh viên tự đấu. Giáo viên là người đóng aptomat tổng/nhóm sau khi kiểm tra bằng mắt. Nếu bàn kit dùng LOGO! 230RC, mọi thao tác đấu và cấp điện do giáo viên giám sát trực tiếp, sinh viên không tự đo điện lưới 230 V.",
    "AN TOÀN: nhắc LOGO! không thay thế mạch dừng khẩn cấp và thiết bị bảo vệ; nhắc lắp cầu chì ngoài cho ngõ ra relay (giáo trình không nêu giá trị, lấy theo manual/nhãn của kit). Câu \"không cần dây nối đất\" trong giáo trình không dạy như quy tắc chung; đấu PE/FE theo hướng dẫn kit.",
    "KIỂM TRA TRÊN KIT TRƯỚC GIỜ DẠY: (1) đọc nhãn thật: mã đặt hàng (6ED1052-1MD...), thế hệ (0BA8 hay 0BA1 đến 0BA3), điện áp nguồn; (2) có DM8 12/24R hay không, DM8 có nhận được khi ghép không và địa chỉ I9 đến I12, Q5 đến Q8 hiển thị đúng trong LOGO!Soft Comfort (cấu hình phần cứng) hay không, nếu không có DM8 thì bỏ các bước đấu DM8 và dùng ví dụ giấy; (3) nguồn bàn kit đúng 24 VDC; (4) LOGO!Soft Comfort V8.4 cài sẵn và mở được; (5) đã nạp chương trình kiểm tra I/O; (6) có mẫu hoặc ảnh model transistor (LOGO! 24) vì kit mặc định là relay; (7) số kit để chia nhóm.",
    "HIỂU LẦM CẦN ĐỂ Ý: cấp 230 V cho model 24 V hoặc ngược lại; cho rằng 230 V lớn hơn ngưỡng nên an toàn; ngõ ra transistor nối trực tiếp cuộn 230 VAC; dòng relay 10 A áp dụng cho cả tải cảm (thực tế 3 A); DM8 đếm lại địa chỉ từ I1; cộng số module vào và số module ra thay vì lấy giá trị lớn hơn; điện áp đồng hồ vạn năng số đo được có nghĩa là có điện áp thật ở ngõ vào 230 V; nhầm chữ R/không R; tin LOGO! thay được nút dừng khẩn cấp.",
    "SỐ LIỆU GIÁO TRÌNH CÒN MÂU THUẪN, KHÔNG ĐƯA VÀO PHẦN HỌC VIÊN: relay 10 A/3 A (bảng) so với 8 A/2 A (văn bản mục 1.2.1); 230RC 85-256 VAC so với 85-264 V; ngưỡng mức 1 của model 24 là 12 VDC (bảng) hay 15 VDC (văn bản); dòng vào 230RC 0,05 mA so với 0,24 mA; mức 0/1 nêu là VDC trong bảng nhưng VAC trong văn bản; giáo trình ghi 230RC có 6 ngõ vào số, trong khi 230RCE (0BA8) có 8; LOGO! 24 ghi 4 transistor nhưng Hình 1.3 (24L) có 6 ngõ ra; \"16 đầu ra số\" không khớp 4 + 4 × 4 = 20; số module tối đa và thứ tự ghép không có. Bài đã dùng 10 A/3 A cho 12/24RCE (khớp datasheet của model này), 5 A cho relay DM8, ngưỡng 40 V/79 V cho model 230 V theo giáo trình. Cần đối chiếu catalogue/datasheet đúng model và thế hệ.",
    "Địa chỉ ngõ ra mở rộng (Q5 đến Q8, Q9 đến Q12) là suy ra từ cách đánh địa chỉ liên tục, giáo trình chỉ nêu địa chỉ ngõ vào mở rộng; kiểm chứng trên LOGO!Soft Comfort trước khi dùng làm đáp án. Họ nguồn module phải trùng khối cơ bản (DM8 12/24R với 12/24RCE) cũng cần đối chiếu manual.",
    "Đáp án cho bài tập về nhà (230RC thêm 10 vào 230 VAC + 6 ra relay): theo giáo trình, DM8 230R, 10 vào cần 3 module (12 vào), 6 ra cần 2 module (8 ra), nên lấy 3 module, tổng 18 vào, 16 ra (4 + 12); kiểm tra số module tối đa trước khi chấp nhận.",
    "Mô đun giới thiệu chiếm khoảng 10 phút (gồm dẫn nhập và giới thiệu chủ đề); nếu thiếu thời gian, rút gọn phần trình bày nhóm ở pha kết thúc và để sinh viên đọc mục B1-s1 ở nhà. Pha thực hành 110 phút đã bao gồm đo, kiểm tra chéo và dọn kit; nếu còn dư, cho sinh viên làm thêm bài chẩn đoán I3 = 0 bằng VOM có tải thử.",
    "Chương trình kiểm tra I/O chỉ nối ngõ vào với ngõ ra tương ứng để xác nhận đấu nối; không phải đáp án bài lập trình của các bài sau. Giáo trình thiếu trình tự đấu nối chung, bài đã bổ sung 6 bước (cắt nguồn, đọc nhãn, đối chiếu sơ đồ, đấu, kiểm tra, đo trước khi cấp điện).",
