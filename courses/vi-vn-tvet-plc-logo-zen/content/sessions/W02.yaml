  "teacher_notes": [
    "BẢN QUYỀN PHẦN MỀM: giáo trình mô tả cài V7 rồi nâng cấp lên V8.1 từ nguồn không rõ (có bước \"mở V7 bắt buộc\" không giải thích). Không làm theo. Dùng bộ cài LOGO!Soft Comfort V8.4 hợp lệ của nhà trường (mã đặt hàng Siemens 6ED1058-0BA08-0YA1, ghi nhận từ nguồn thương mại, cần xác nhận). Không dùng bản bẻ khóa; ảnh trong giáo trình là bản cũ (V5.0/V7/V8.1) nên giao diện V8.4 sẽ khác.",
    "KIỂM TRA PHIÊN BẢN trước giờ dạy: Help > About trên mọi máy; bảo đảm cùng V8.4 (định dạng tệp V8.4 không mở ngược bằng V8.3, nguồn bên thứ ba, chưa xác minh). Kiểm tra chạy được trên Windows 10/11 của phòng máy và chọn đúng loại thiết bị theo nhãn kit (12/24RCE hay 230RCE).",
    "SỐ NGÕ VÀO CỦA OR: giáo trình/rubric mô tả OR có 3 ngõ vào (I1, I2, X); LOGO! 8 có thể có 4 ngõ vào, khi đó còn hai X. Kiểm tra trên kit; bảng x của NAND = 1 lấy từ manual Siemens, giáo trình chỉ nêu AND, OR, NOR, XOR: xác nhận trên mô phỏng.",
    "OFF-DELAY, KHÔNG KIỂM TRA MÉP: giáo trình tự mâu thuẫn (một câu nói Ta khởi động lại khi Trg xuống, câu khác nói cạnh lên Trg reset Ta). Bài dạy theo manual: Q = 1 khi Trg = 1, bắt đầu đếm ở cạnh Trg 1 sang 0, Q = 0 sau T, R reset. Các trường hợp chưa xác minh, cần chạy trên kit hoặc Simulation V8.4 trước khi khẳng định: (a) Trg lên lại khi đang đếm (bị hủy hay retrigger); (b) R = 1 trong khi Trg còn 1 và sau khi R về 0; (c) tham số Rem giữ Ta qua mất điện. KHÔNG dùng các tình huống này để chấm HS; câu hỏi và bài tự kiểm tra B2 chỉ dùng các hành vi đã thống nhất.",
    "HIỂU LẦM CẦN BẮT QUA CÂU HỎI BẢN LỀ: (1) On-delay bị ngắt chỉ \"tạm dừng\" (B2-c4, t2); (2) AND cạnh giữ nhiều chu kỳ (B2-c3); (3) Off-delay đếm từ cạnh lên (B2-c5, t3); (4) ưu tiên S/R là ai đến trước (B2-c6); (5) x luôn bằng 0 hoặc hở là 0 (B2-c1, t1); (6) nhầm F5/F3 (B2-c9). Các hiểu lầm về Retentive on-delay, Weekly timer, Hour counter không nằm trong phạm vi buổi này.",
    "AN TOÀN VÀ MODEL: ảnh sơ đồ nối trong giáo trình ghi LOGO! 12/24RC (nguồn DC) nhưng nối L1/N 230 V AC; xác nhận nhãn và nguồn từng kit trước khi cấp điện. Ngắt nguồn khi đấu S1, S2, tải; tải Q1 không vượt định mức (rơ-le 10 A tải trở, 3 A tải cảm; transistor tối đa 0,3 A). Thông số kit là giả định tới khi giáo viên xác nhận.",
    "NỘI DUNG GIÁO TRÌNH THIẾU (mức đầy đủ 2/5): không có chọn model, truyền chương trình PC sang LOGO!, giám sát online, mục soạn thảo FBD trống; bài này không dạy phần đó. Nếu kit có cáp, có thể trình diễn truyền chương trình như phần mở rộng, không đưa vào đánh giá.",
    "KIỂM TRA TRƯỚC GIỜ DẠY: dựng lại OR bằng phím và bằng LSC trên chính kit; chạy 4 widget trong trang bài; xác nhận câu truy hồi B1 khớp nội dung B1 đã soạn (mã model, relay và transistor). Widget chỉ minh họa, không thay lời giải lab; lời giải của LOGO-PRAC-2 chỉ ở bản giáo viên.",
    "QUẢN LÝ THỜI GIAN: các bước i_do rất ngắn (6 đến 10 phút). Nếu chậm, bỏ bảng tra cứu s5 (chỉ nêu tên) hoặc rút bước we_do còn bước 1 đến 5 để giữ ít nhất 90 phút thực hành. Nếu thiếu kit, HS luân phiên: nhóm nhập OR trên LSC trước, nhóm khác dùng kit, rồi đổi.",
    "MENU VÀ PHÍM (đã rà soát): bài viết theo LOGO! 8 — ESC mở menu chính; Program → Edit → Edit Prg; Setup → Clock → Set Clock. Tổ hợp ba phím trong giáo trình là cách của các đời LOGO! cũ. Chạy thử toàn bộ ví dụ B2-we1 trên kit trước giờ dạy và sửa tên mục menu nếu firmware khác."
